<!doctype html>
<html lang="en">
  <!-- <html lang="en" class="dark"> — uncomment for dark-by-default (replace the tag above; `dark` is a Tailwind variant, never `@apply` it) -->
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cek dan bayar tagihan rutin — listrik pascabayar, Indihome, Biznet, PDAM, Telkom, dan BPJS Kesehatan lewat Digiflazz." />
    <title>Tagihan Rutin — Cek & Bayar PPOB</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      function sendHeightToParent() {
        const height = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
          document.body.offsetHeight,
          document.documentElement.offsetHeight
        );
        window.parent.postMessage({ height: height }, '*');
      }

      window.addEventListener('load', sendHeightToParent);
      window.addEventListener('resize', sendHeightToParent);

      if (window.ResizeObserver) {
        new ResizeObserver(sendHeightToParent).observe(document.body);
      }

      setTimeout(sendHeightToParent, 500);
      setTimeout(sendHeightToParent, 1500);
    </script>
  </body>
</html>
